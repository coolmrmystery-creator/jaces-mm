<!DOCTYPE html>
<html>
<head>
  <title>Web3 Escrow</title>


  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

  <style>
    body { font-family: Arial; background:#0f0f0f; color:white; text-align:center; }
    button { padding:10px; margin:5px; cursor:pointer; }
  </style>
</head>

<body>

<h2>Web3 Escrow Platform</h2>

<button onclick="connect()">Connect Wallet</button>
<p id="wallet"></p>

<hr>

<input id="seller" placeholder="Seller address">
<input id="amount" placeholder="ETH amount">

<button onclick="createTrade()">Create Escrow</button>

<script>

let provider, signer, contract;

// connect wallet
async function connect() {
  provider = new ethers.providers.Web3Provider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  signer = provider.getSigner();

  const address = await signer.getAddress();
  wallet.innerText = address;
}

// deploy / interact contract
async function createTrade() {

  const seller = document.getElementById("seller").value;
  const value = document.getElementById("amount").value;

  const abi = [
    "function confirm()",
    "function cancel()"
  ];

  // You deploy contract separately in Remix and paste address here:
  const contractAddress = "PASTE_DEPLOYED_CONTRACT_ADDRESS";

  contract = new ethers.Contract(contractAddress, abi, signer);

  const tx = await signer.sendTransaction({
    to: contractAddress,
    value: ethers.utils.parseEther(value)
  });

  alert("Escrow created!");
}
  <button onclick="logout()">Logout</button>


</script>

</body>
</html>
