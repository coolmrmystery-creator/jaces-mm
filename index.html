<!DOCTYPE html>
<html>

<head>
  <title>Escrow Chat</title>

  <!-- ✅ STEP 2: Firebase scripts (PUT HERE) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>

<body>

  <!-- ✅ STEP 5: UI (PUT HERE) -->
  <h2>Live Trade Chat</h2>

  <input id="myAddress" placeholder="Your wallet address">
  <input id="otherAddress" placeholder="Other trader address">
  <button onclick="startChat()">Start Chat</button>

  <br><br>

  <input id="msg" placeholder="Type message">
  <button onclick="send()">Send</button>

  <div id="chatBox" style="border:1px solid black; height:200px; overflow:auto;"></div>


  <!-- ✅ STEP 3 + 4: ALL JS GOES AT BOTTOM -->
  <script>

    // STEP 3: Firebase config
    const firebaseConfig = {
      apiKey: "YOUR_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT.firebaseio.com",
      projectId: "YOUR_PROJECT"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();


    // STEP 4: Chat logic
    let tradeRoom = "";

    function startChat() {
      const userA = document.getElementById("myAddress").value;
      const userB = document.getElementById("otherAddress").value;

      tradeRoom = "trade_" + userA + "_" + userB;

      listenMessages();
      alert("Chat started!");
    }

    function send() {
      const text = document.getElementById("msg").value;
      const sender = document.getElementById("myAddress").value;

      if (!text) return;

      db.ref(tradeRoom).push({
        text: text,
        sender: sender,
        time: Date.now()
      });

      document.getElementById("msg").value = "";
    }

    function listenMessages() {
      db.ref(tradeRoom).on("child_added", (snapshot) => {
        const msg = snapshot.val();

        const box = document.getElementById("chatBox");
        box.innerHTML += `<p><b>${msg.sender}:</b> ${msg.text}</p>`;
      });
    }

  </script>

</body>
</html>
