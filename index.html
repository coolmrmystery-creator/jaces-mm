<body>

  <!-- 🔵 YOUR UI (buttons, inputs) goes here -->
  <input id="email" placeholder="Email">
  <input id="password" placeholder="Password">
  <button onclick="signup()">Signup</button>
  <button onclick="login()">Login</button>

  <input id="username" placeholder="Username">
  <button onclick="saveUsername()">Save Username</button>

  <!-- 🔴 ALL JAVASCRIPT GOES HERE -->
  <script>

    // Firebase setup
    const firebaseConfig = {
      apiKey: "YOUR_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT.firebaseio.com",
      projectId: "YOUR_PROJECT"
    };

    firebase.initializeApp(firebaseConfig);

    // =========================
    // STEP 1: SIGNUP + LOGIN
    // =========================

    function signup() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      firebase.auth().createUserWithEmailAndPassword(email, password)
        .then(() => {
          alert("Account created");
        })
        .catch(err => alert(err.message));
    }

    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      firebase.auth().signInWithEmailAndPassword(email, password)
        .then(() => {
          alert("Logged in");
        })
        .catch(err => alert(err.message));
    }

    // =========================
    // STEP 2: SAVE USERNAME
    // =========================

    function saveUsername() {
      const username = document.getElementById("username").value;
      const user = firebase.auth().currentUser;

      if (!user) {
        alert("Login first");
        return;
      }

      firebase.database().ref("users/" + user.uid).set({
        username: username
      });

      alert("Username saved");
    }

  </script>

    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();


    // STEP 4: Chat logic
    let tradeRoom = "";

    function startChat() {
      const userA = document.getElementById("myAddress").value;
      const userB = document.getElementById("otherAddress").value;

      tradeRoom = "trade_" + userA + "_" + userB;

      listenMessages();
      alert("Chat started!");
    }

    function send() {
      const text = document.getElementById("msg").value;
      const sender = document.getElementById("myAddress").value;

      if (!text) return;

      db.ref(tradeRoom).push({
        text: text,
        sender: sender,
        time: Date.now()
      });

      document.getElementById("msg").value = "";
    }

    function listenMessages() {
      db.ref(tradeRoom).on("child_added", (snapshot) => {
        const msg = snapshot.val();

        const box = document.getElementById("chatBox");
        box.innerHTML += `<p><b>${msg.sender}:</b> ${msg.text}</p>`;
      });
    }

  </script>
