<!DOCTYPE html>
<html>
<head>
  <title>Escrow DApp</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>
</head>
<body>

<h2>Simple Escrow</h2>

<button onclick="connectWallet()">Connect Wallet</button>
<p id="account"></p>

<hr>

<h3>Contract</h3>
<input id="contractAddress" placeholder="Contract Address">
<button onclick="loadContract()">Load Contract</button>

<hr>

<h3>Actions</h3>
<button onclick="confirm()">Confirm Trade</button>
<button onclick="cancel()">Cancel Trade</button>

<script>
let provider, signer, contract;

const abi = [
  "function confirm() public",
  "function cancel() public"
];

async function connectWallet() {
  if (window.ethereum) {
    await ethereum.request({ method: 'eth_requestAccounts' });
    provider = new ethers.providers.Web3Provider(window.ethereum);
    signer = provider.getSigner();

    const address = await signer.getAddress();
    document.getElementById("account").innerText = "Connected: " + address;
  } else {
    alert("Install MetaMask");
  }
}

function loadContract() {
  const addr = document.getElementById("contractAddress").value;
  contract = new ethers.Contract(addr, abi, signer);
  alert("Contract loaded");
}

async function confirm() {
  const tx = await contract.confirm();
  await tx.wait();
  alert("Confirmed!");
}

async function cancel() {
  const tx = await contract.cancel();
  await tx.wait();
  alert("Cancelled!");
}
</script>

</body>
</html>
