<!DOCTYPE html>
<html>
<head>
  <title>Web3 Escrow Login</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#1e2a38,#4a6fa5);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      color:white;
    }

    .box{
      width:350px;
      background:rgba(255,255,255,0.1);
      padding:30px;
      border-radius:20px;
      backdrop-filter:blur(10px);
    }

    input{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      box-sizing:border-box;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      background:#6ea8fe;
      color:white;
      cursor:pointer;
    }

  </style>
</head>
<body>

<div class="box">

  <h1>Web3 Escrow</h1>

  <input id="username" placeholder="Username">

  <input id="email" placeholder="Email">

  <input id="password" type="password" placeholder="Password">

  <button onclick="signup()">
    Sign Up
  </button>

  <button onclick="login()">
    Login
  </button>

</div>

<script>

const firebaseConfig = {

  apiKey: "YOUR_API_KEY",

  authDomain:
  "YOUR_PROJECT.firebaseapp.com",

  databaseURL:
  "https://YOUR_PROJECT-default-rtdb.firebaseio.com",

  projectId:
  "YOUR_PROJECT"

};

firebase.initializeApp(firebaseConfig);

function signup(){

  const username =
  document.getElementById(
    "username"
  ).value.toLowerCase().trim();

  const email =
  document.getElementById(
    "email"
  ).value;

  const password =
  document.getElementById(
    "password"
  ).value;

  firebase.auth()
  .createUserWithEmailAndPassword(
    email,
    password
  )

  .then((userCredential)=>{

    const uid =
    userCredential.user.uid;

    return firebase.database()
    .ref("users/" + uid)
    .set({

      username: username,
      email: email

    });

  })

  .then(()=>{

    window.location.href =
    "app.html";

  })

  .catch(err=>{

    alert(err.message);

  });

}

function login(){

  const email =
  document.getElementById(
    "email"
  ).value;

  const password =
  document.getElementById(
    "password"
  ).value;

  firebase.auth()
  .signInWithEmailAndPassword(
    email,
    password
  )

  .then(()=>{

    window.location.href =
    "app.html";

  })

  .catch(err=>{

    alert(err.message);

  });

}

</script>

</body>
</html>
