<!DOCTYPE html>
<html>
<head>
  <title>Login - Trade Platform</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <style>
    body {
      margin:0;
      font-family: Arial;
      background: linear-gradient(135deg, #1e2a38, #4a6fa5);
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card {
      background: rgba(255,255,255,0.1);
      padding:30px;
      border-radius:15px;
      backdrop-filter: blur(10px);
      width:320px;
      text-align:center;
    }

    input {
      width:90%;
      padding:10px;
      margin:8px;
      border:none;
      border-radius:5px;
    }

    button {
      width:95%;
      padding:10px;
      margin:5px;
      background:#6ea8fe;
      border:none;
      color:white;
      cursor:pointer;
      border-radius:5px;
    }

    .error {
      color: #ff6b6b;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Trade Platform</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <input id="username" placeholder="Username (for signup only)">

  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Login</button>

  <p class="error" id="error"></p>
</div>

<script>

// =======================
// 🔧 YOUR FIREBASE CONFIG
// =======================
const firebaseConfig = {
 apiKey: "AIzaSyDFsQbvotmK9ZXG8srNEBkpZiIhUMGe5Dc",
  authDomain: "jace-mm.firebaseapp.com",
  databaseURL: "https://jace-mm-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "jace-mm",

firebase.initializeApp(firebaseConfig);

// =======================
// SIGNUP
// =======================
function signup() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const username = document.getElementById("username").value;

  if (!email || !password || !username) {
    showError("Fill all fields");
    return;
  }

  firebase.auth().createUserWithEmailAndPassword(email, password)
    .then((user) => {

      // Save username
      firebase.database().ref("users/" + user.user.uid).set({
        username: username,
        email: email
      });

      // Redirect
      window.location.href = "app.html";
    })
    .catch(err => showError(err.message));
}

// =======================
// LOGIN
// =======================
function login() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showError("Enter email & password");
    return;
  }

  firebase.auth().signInWithEmailAndPassword(email, password)
    .then(() => {
      window.location.href = "app.html";
    })
    .catch(err => showError(err.message));
}

// =======================
// ERROR DISPLAY
// =======================
function showError(msg) {
  document.getElementById("error").innerText = msg;
}

</script>

</body>
</html>
