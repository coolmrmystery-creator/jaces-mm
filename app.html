<!DOCTYPE html>
<html>
<head>
  <title>Web3 Trade Dashboard</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <!-- Web3 -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

  <style>
    body {
      margin:0;
      font-family: Arial;
      background: linear-gradient(135deg, #1e2a38, #4a6fa5);
      color:white;
    }

    .topbar {
      padding:15px;
      display:flex;
      justify-content:space-between;
      background: rgba(0,0,0,0.4);
    }

    .container {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
      padding:20px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      padding:15px;
      border-radius:10px;
      backdrop-filter: blur(10px);
    }

    input, button {
      width:95%;
      padding:10px;
      margin:5px;
      border:none;
      border-radius:5px;
    }

    button {
      background:#6ea8fe;
      color:white;
      cursor:pointer;
    }

    #chatBox {
      height:250px;
      overflow:auto;
      background:#111;
      padding:10px;
    }
  </style>
</head>

<body>

<div class="topbar">
  <div>Web3 Trade Dashboard</div>
  <div>
    <button onclick="connectWallet()">Connect Wallet</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<div class="container">

  <!-- TRADE -->
  <div class="card">
    <h3>Create Trade</h3>

    <input id="toUser" placeholder="Username">
    <input id="offer" placeholder="I offer">
    <input id="want" placeholder="I want">

    <button onclick="createTrade()">Send Request</button>

    <h3>Incoming Requests</h3>
    <div id="requests"></div>
  </div>

  <!-- CHAT -->
  <div class="card">
    <h3>Chat</h3>
    <div id="chatBox"></div>

    <input id="msg" placeholder="Message">
    <button onclick="sendMsg()">Send</button>
  </div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDFsQbvotmK9ZXG8srNEBkpZiIhUMGe5Dc",
  authDomain: "jace-mm.firebaseapp.com",
  databaseURL: "https://jace-mm-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "jace-mm",

};

firebase.initializeApp(firebaseConfig);

let currentUser = null;
let chatRoom = "";
let provider, signer;

// =======================
// AUTH CHECK
// =======================
firebase.auth().onAuthStateChanged(user => {
  if (!user) {
    window.location.href = "login.html";
  } else {
    currentUser = user;
    loadRequests();
  }
});

// =======================
// WALLET CONNECT (FIXED)
// =======================
async function connectWallet() {
  if (!window.ethereum) {
    alert("Install MetaMask");
    return;
  }

  try {
    provider = new ethers.providers.Web3Provider(window.ethereum);
    await provider.send("eth_requestAccounts", []);

    signer = provider.getSigner();
    const address = await signer.getAddress();

    alert("Connected: " + address);

  } catch (err) {
    console.error(err);
    alert("Wallet connection failed");
  }
}

// =======================
// FIND USER (FIXED)
// =======================
function findUser(username, callback) {
  firebase.database().ref("users")
    .orderByChild("username")
    .equalTo(username)
    .once("value")
    .then(snapshot => {
      if (!snapshot.exists()) {
        alert("User not found");
        return;
      }

      snapshot.forEach(child => {
        callback(child.key);
      });
    });
}

// =======================
// CREATE TRADE (FIXED)
// =======================
function createTrade() {

  const username = document.getElementById("toUser").value;
  const offerVal = document.getElementById("offer").value;
  const wantVal = document.getElementById("want").value;

  if (!username || !offerVal || !wantVal) {
    alert("Fill all fields");
    return;
  }

  findUser(username, (toUID) => {

    firebase.database().ref("requests").push({
      from: currentUser.uid,
      to: toUID,
      offer: offerVal,
      want: wantVal,
      status: "pending"
    })
    .then(() => {
      alert("Trade request sent!");
    });

  });
}

// =======================
// LOAD REQUESTS (FIXED)
// =======================
function loadRequests() {
  firebase.database().ref("requests")
    .orderByChild("to")
    .equalTo(currentUser.uid)
    .on("value", snapshot => {

      const container = document.getElementById("requests");
      container.innerHTML = "";

      snapshot.forEach(item => {
        const data = item.val();

        container.innerHTML += `
          <div style="margin:5px; padding:10px; background:#2a2a2a;">
            ${data.offer} → ${data.want}
            <button onclick="accept('${item.key}','${data.from}')">Accept</button>
          </div>
        `;
      });
    });
}

// =======================
// ACCEPT TRADE
// =======================
function accept(id, from) {
  firebase.database().ref("requests/" + id).update({
    status: "accepted"
  });

  chatRoom = "trade_" + from + "_" + currentUser.uid;

  listenChat();
}

// =======================
// CHAT SYSTEM
// =======================
function listenChat() {
  firebase.database().ref(chatRoom)
    .on("child_added", snapshot => {
      const msg = snapshot.val();
      document.getElementById("chatBox").innerHTML += `<p>${msg.text}</p>`;
    });
}

function sendMsg() {
  const text = document.getElementById("msg").value;

  if (!text) return;

  firebase.database().ref(chatRoom).push({
    text: text
  });

  document.getElementById("msg").value = "";
}

// =======================
// LOGOUT
// =======================
function logout() {
  firebase.auth().signOut().then(() => {
    window.location.href = "login.html";
  });
}

</script>

</body>
</html>
