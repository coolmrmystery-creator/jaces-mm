<!DOCTYPE html>
<html>
<head>
  <title>Web3 Trade Dashboard</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <!-- Web3 -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

  <style>
    body {
      margin:0;
      font-family: Arial;
      background: linear-gradient(135deg, #1e2a38, #4a6fa5);
      color:white;
    }

    .topbar {
      padding:15px;
      display:flex;
      justify-content:space-between;
      background: rgba(0,0,0,0.4);
    }

    .container {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
      padding:20px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      padding:15px;
      border-radius:10px;
      backdrop-filter: blur(10px);
    }

    input, button {
      width:95%;
      padding:10px;
      margin:5px;
      border:none;
      border-radius:5px;
    }

    button {
      background:#6ea8fe;
      color:white;
      cursor:pointer;
    }

    #chatBox {
      height:250px;
      overflow:auto;
      background:#111;
      padding:10px;
    }
  </style>
</head>

<body>

<div class="topbar">
  <div id="walletDisplay">Web3 Trade Dashboard</div>
  <div>
    <button onclick="connectWallet()">Connect Wallet</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<div class="container">

  <div class="card">
    <h3>Create Trade</h3>
    
    <input id="toUser" placeholder="Username">
    <input id="offer" placeholder="I offer">
    <input id="want" placeholder="I want">

    <input id="sellerWallet" placeholder="Seller Wallet Address">

<input id="ethAmount" placeholder="ETH Amount">

<button onclick="createEscrowTrade()">
  Create Escrow
</button>

    <button onclick="createTrade()">Send Request</button>

    <h3>Incoming Requests</h3>
    <div id="requests"></div>
  </div>

  <div class="card">
    <h3>Chat</h3>
    <div id="chatBox"></div>

    <input id="msg" placeholder="Message">
    <button onclick="sendMsg()">Send</button>

    <input id="tradeId" placeholder="Trade ID">

<button onclick="confirmEscrow()">
Confirm Trade
</button>
  </div>

</div>

<script>

console.log("App loaded");
  // ====================
  //wallwt connect fix#2
  // ====================
async function createEscrowTrade() {

  if(!signer) {
    alert("Connect wallet first");
    return;
  }

  const seller =
    document.getElementById("sellerWallet").value;

  const amount =
    document.getElementById("ethAmount").value;

  try {

    const tx = await contract.createTrade(
      seller,
      {
        value: ethers.utils.parseEther(amount)
      }
    );

    await tx.wait();

    alert("Escrow created!");

  } catch(err) {
    console.error(err);
    alert("Escrow failed");
  }
}
  
// =======================
// FIREBASE CONFIG
// =======================
const firebaseConfig = {
  apiKey: "AIzaSyDFsQbvotmK9ZXG8srNEBkpZiIhUMGe5Dc",
  authDomain: "jace-mm.firebaseapp.com",
  databaseURL: "https://jace-mm-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "jace-mm"
};

firebase.initializeApp(firebaseConfig);

let currentUser = null;
let chatRoom = "";
let provider, signer;
let chatListenerAttached = false;

// =======================
// AUTH CHECK
// =======================
firebase.auth().onAuthStateChanged(user => {
  if (!user) {
    window.location.href = "login.html";
  } else {
    currentUser = user;
    loadRequests();
  }
});

// =======================
// WALLET FIXED
// =======================
if (window.ethereum) {
  window.ethereum.on('accountsChanged', () => location.reload());
}

async function connectWallet() {

  if (!window.ethereum) {
    alert("Install MetaMask");
    return;
  }

  try {
    provider = new ethers.providers.Web3Provider(window.ethereum);

    await window.ethereum.request({ method: 'eth_requestAccounts' });

    signer = provider.getSigner();
    contract = new ethers.Contract(
  contractAddress,
  contractABI,
  signer
);

    const address = await signer.getAddress();

    document.getElementById("walletDisplay").innerText =
      "Connected: " + address.slice(0,6) + "..." + address.slice(-4);

    console.log("Wallet connected:", address);

  } catch (err) {
    console.error(err);
    alert("Wallet connection failed");
  }
}

// =======================
// FIND USER
// =======================
function findUser(username, callback) {
  firebase.database().ref("users")
    .orderByChild("username")
    .equalTo(username)
    .once("value")
    .then(snapshot => {

      if (!snapshot.exists()) {
        alert("User not found");
        return;
      }

      snapshot.forEach(child => {
        callback(child.key);
      });
    });
}

// =======================
// CREATE TRADE
// =======================
let chatListenerAttached = false;

function listenChat() {

  if (!chatRoom) {
    chatRoom = localStorage.getItem("chatRoom");
  }

  if (!chatRoom) return;

  // 🔥 prevent duplicate listeners
  if (chatListenerAttached) return;

  chatListenerAttached = true;

  const chatBox = document.getElementById("chatBox");

  firebase.database()
    .ref(chatRoom)
    .on("child_added", snapshot => {

      const msg = snapshot.val();

      const div = document.createElement("div");

      div.style.padding = "5px";
      div.style.margin = "5px";
      div.style.background = "#2a2a2a";
      div.style.borderRadius = "5px";

      div.innerText = msg.text;

      chatBox.appendChild(div);

      chatBox.scrollTop = chatBox.scrollHeight;
    });
}

// =======================
// LOAD REQUESTS
// =======================
function loadRequests() {
  firebase.database().ref("requests")
    .orderByChild("to")
    .equalTo(currentUser.uid)
    .on("value", snapshot => {

      const container = document.getElementById("requests");
      container.innerHTML = "";

      snapshot.forEach(item => {
        const data = item.val();

        container.innerHTML += `
          <div style="margin:5px; padding:10px; background:#2a2a2a;">
            ${data.offer} → ${data.want}
            <button onclick="accept('${item.key}','${data.from}')">Accept</button>
          </div>
        `;
      });
    });
}

// =======================
// ACCEPT TRADE
// =======================
function accept(id, from) {

  firebase.database().ref("requests/" + id).update({
    status: "accepted"
  });

  chatRoom = "trade_" + from + "_" + currentUser.uid;

  listenChat();
}
//========================
//crypto holder
// =======================
  const contractAddress = "0xD7ACd2a9FD159E69Bb102A1ca21C9a3e3A5F771B";

const contractABI = [
  [
  {
    "inputs": [
      {
        "internalType": "uint256",
        "name": "tradeId",
        "type": "uint256"
      }
    ],
    "name": "confirmTrade",
    "outputs": [],
    "stateMutability": "nonpayable",
    "type": "function"
  },
  {
    "inputs": [
      {
        "internalType": "address",
        "name": "seller",
        "type": "address"
      }
    ],
    "name": "createTrade",
    "outputs": [],
    "stateMutability": "payable",
    "type": "function"
  },
  {
    "inputs": [],
    "name": "tradeCount",
    "outputs": [
      {
        "internalType": "uint256",
        "name": "",
        "type": "uint256"
      }
    ],
    "stateMutability": "view",
    "type": "function"
  },
  {
    "inputs": [
      {
        "internalType": "uint256",
        "name": "",
        "type": "uint256"
      }
    ],
    "name": "trades",
    "outputs": [
      {
        "internalType": "address",
        "name": "buyer",
        "type": "address"
      },
      {
        "internalType": "address",
        "name": "seller",
        "type": "address"
      },
      {
        "internalType": "uint256",
        "name": "amount",
        "type": "uint256"
      },
      {
        "internalType": "bool",
        "name": "buyerConfirmed",
        "type": "bool"
      },
      {
        "internalType": "bool",
        "name": "sellerConfirmed",
        "type": "bool"
      },
      {
        "internalType": "bool",
        "name": "completed",
        "type": "bool"
      }
    ],
    "stateMutability": "view",
    "type": "function"
  }
]
];

let contract;


//======================
//confirm function
//======================

  async function confirmEscrow() {

  const tradeId =
    document.getElementById("tradeId").value;

  try {

    const tx =
      await contract.confirmTrade(tradeId);

    await tx.wait();

    alert("Trade confirmed!");

  } catch(err) {
    console.error(err);
    alert("Confirmation failed");
  }
}
  
// =======================
// CHAT
// =======================
function listenChat() {
  firebase.database().ref(chatRoom)
    .on("child_added", snapshot => {
      const msg = snapshot.val();
      document.getElementById("chatBox").innerHTML += `<p>${msg.text}</p>`;
    });
}

function sendMsg() {
  const text = document.getElementById("msg").value;

  if (!text) return;

  firebase.database().ref(chatRoom).push({ text: text });

  document.getElementById("msg").value = "";
}

// =======================
// LOGOUT
// =======================
function logout() {
  firebase.auth().signOut().then(() => {
    window.location.href = "login.html";
  });
}

</script>

</body>
</html>
