<!DOCTYPE html>
<html>
<head>
  <title>Web3 Escrow Trade Platform</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <!-- Ethers -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#1e2a38,#4a6fa5);
      color:white;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px;
      background:rgba(0,0,0,0.4);
      backdrop-filter:blur(10px);
    }

    .container{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
      padding:20px;
    }

    .card{
      background:rgba(255,255,255,0.1);
      border-radius:15px;
      padding:20px;
      backdrop-filter:blur(10px);
      box-shadow:0 0 15px rgba(0,0,0,0.2);
    }

    input{
      width:95%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:8px;
      outline:none;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:8px;
      background:#6ea8fe;
      color:white;
      cursor:pointer;
      font-weight:bold;
      transition:0.2s;
    }

    button:hover{
      opacity:0.9;
    }

    #chatBox{
      height:300px;
      overflow-y:auto;
      background:#111;
      border-radius:10px;
      padding:10px;
    }

    .msg{
      background:#2a2a2a;
      padding:8px;
      border-radius:8px;
      margin:5px 0;
    }

    .request{
      background:#2a2a2a;
      padding:10px;
      border-radius:10px;
      margin-top:10px;
    }

  </style>
</head>

<body>

<div class="topbar">

  <div id="walletDisplay">
    Web3 Escrow Platform
  </div>

  <div>
    <button onclick="connectWallet()">
      Connect Wallet
    </button>
    <button
id="walletBtn"
onclick="connectWallet()">

    <button onclick="logout()">
      Logout
    </button>
  </div>

</div>

<div class="container">

  <!-- LEFT -->
  <div class="card">

    <h2>Create Trade</h2>

    <input id="toUser" placeholder="Trader Username">

    <input id="offer" placeholder="What you offer">

    <input id="want" placeholder="What you want">

    <button onclick="createTrade()">
      Send Trade Request
    </button>

    <hr>

    <h2>Escrow</h2>

    <input id="sellerWallet"
    placeholder="Seller Wallet Address">

    <input id="ethAmount"
    placeholder="ETH Amount">

    <button onclick="createEscrowTrade()">
      Create Escrow
    </button>

    <input id="tradeId"
    placeholder="Trade ID">

    <button onclick="confirmEscrow()">
      Confirm Trade
    </button>

    <hr>

    <h2>Incoming Requests</h2>

    <div id="requests"></div>

  </div>

  <!-- RIGHT -->
  <div class="card">

    <h2>Trade Chat</h2>

    <div id="chatBox"></div>

    <input id="msg"
    placeholder="Message">

    <button onclick="sendMsg()">
      Send
    </button>

  </div>

</div>

<script>

console.log("Platform Loaded");

// ========================
// FIREBASE CONFIG
// ========================

const firebaseConfig = {

  apiKey: "AIzaSyDFsQbvotmK9ZXG8srNEBkpZiIhUMGe5Dc",
  authDomain: "jace-mm.firebaseapp.com",
  databaseURL: "https://jace-mm-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "jace-mm",

};

firebase.initializeApp(firebaseConfig);

// ========================
// VARIABLES
// ========================

let currentUser = null;

let chatRoom = "";

let provider, signer, contract;

let chatListenerAttached = false;
  let provider;
let signer;
let contract;

// ========================
// CONTRACT
// ========================

const contractAddress = "";
const contractABI = [];

// ========================
// WALLET EVENTS
// ========================

if(window.ethereum){

  window.ethereum.on(
    "accountsChanged",
    () => location.reload()
  );

}

// ========================
// AUTH CHECK
// ========================

firebase.auth().onAuthStateChanged(user => {

  if(!user){

    window.location.href =
    "login.html";

    return;
  }

  currentUser = user;

  loadRequests();

  // 🔥 check active trades
  firebase.database()
  .ref("requests")
  .on("value", snapshot => {

    snapshot.forEach(item => {

      const data = item.val();

      // if user belongs to trade
      if(
        (data.from === currentUser.uid ||
        data.to === currentUser.uid)

        &&

        data.activeRoom
      ){

        chatRoom = data.activeRoom;

        localStorage.setItem(
          "chatRoom",
          chatRoom
        );

        chatListenerAttached = false;

        listenChat();

      }

    });

  });

});

// ========================
// CONNECT WALLET
// ========================

async function connectWallet(){

  if(!window.ethereum){

    alert("Install MetaMask");

    return;
  }

  try{

    // 🔥 SAVE GLOBALLY
    provider =
    new ethers.providers.Web3Provider(
      window.ethereum
    );

    await provider.send(
      "eth_requestAccounts",
      []
    );

    signer =
    provider.getSigner();

    const address =
    await signer.getAddress();

    // optional contract init
    if(
      contractAddress &&
      contractABI.length > 0
    ){

      contract =
      new ethers.Contract(
        contractAddress,
        contractABI,
        signer
      );

    }

    // button UI
    const btn =
    document.getElementById(
      "walletBtn"
    );

    btn.innerText =
    "Wallet Connected";

    btn.disabled = true;

    btn.style.background =
    "#4CAF50";

    btn.style.opacity = "0.8";

    btn.style.cursor =
    "default";

    // save wallet locally
    localStorage.setItem(
      "walletConnected",
      "true"
    );

    console.log(
      "Wallet Connected:",
      address
    );

  }catch(err){

    console.error(err);

    alert("Wallet connection failed");

  }

}
}
// ========================
// FIND USER
// ========================

function findUser(username, callback){

  firebase.database()
  .ref("users")
  .orderByChild("username")
  .equalTo(username)
  .once("value")
  .then(snapshot => {

    if(!snapshot.exists()){

      alert("User not found");

      return;
    }

    snapshot.forEach(child => {

      callback(child.key);

    });

  });

}

// ========================
// CREATE TRADE
// ========================

function createTrade(){

  const username =
  document.getElementById(
    "toUser"
  ).value.toLowerCase().trim();

  const offer =
  document.getElementById(
    "offer"
  ).value;

  const want =
  document.getElementById(
    "want"
  ).value;

  if(!username || !offer || !want){

    alert("Fill all fields");

    return;
  }

  firebase.database()
  .ref("users")
  .once("value")

  .then(snapshot => {

    let found = false;

    snapshot.forEach(child => {

      const user = child.val();

      if(user.username === username){

        found = true;

        // 🔥 unique room
        const roomId =
        "room_" + Date.now();

        firebase.database()
        .ref("requests")
        .push({

          from: currentUser.uid,

          to: child.key,

          offer: offer,

          want: want,

          room: roomId,

          status: "pending"

        })

        .then(() => {

          localStorage.setItem(
            "chatRoom",
            roomId
          );

          alert("Trade request sent!");

        });

      }

    });

    if(!found){

      alert("User not found");

    }

  });

}
// ========================
// LOAD REQUESTS
// ========================

function loadRequests(){

  firebase.database()
  .ref("requests")
  .orderByChild("to")
  .equalTo(currentUser.uid)
  .on("value", snapshot => {

    const container =
    document.getElementById(
      "requests"
    );

    container.innerHTML = "";

    snapshot.forEach(item => {

      const data = item.val();

      const div =
      document.createElement("div");

      div.className = "request";

      div.innerHTML = `

        <p>
          ${data.offer}
          →
          ${data.want}
        </p>

        <button>
          Accept
        </button>

      `;

      div.querySelector("button")
      .onclick = () => {

        accept(
          item.key,
          data.from,
          data.room
        );

      };

      container.appendChild(div);

    });

  });

}
// ========================
// ACCEPT TRADE
// ========================

function accept(id, from, room){

  firebase.database()
  .ref("requests/" + id)
  .update({

    status: "accepted",

    activeRoom: room

  });

  chatRoom = room;

  localStorage.setItem(
    "chatRoom",
    room
  );

  chatListenerAttached = false;

  listenChat();

  alert("Trade accepted!");

}
// ========================
// CHAT SYSTEM
// ========================

function listenChat(){

  if(!chatRoom) return;

  const chatBox =
  document.getElementById(
    "chatBox"
  );

  chatBox.innerHTML = "";

  firebase.database()
  .ref("chats/" + chatRoom)
  .off();

  firebase.database()
  .ref("chats/" + chatRoom)
  .on("child_added", snapshot => {

    const msg = snapshot.val();

    const div =
    document.createElement("div");

    div.className = "msg";

    div.innerText = msg.text;

    chatBox.appendChild(div);

    chatBox.scrollTop =
    chatBox.scrollHeight;

  });

}
function sendMsg(){

  const text =
  document.getElementById(
    "msg"
  ).value.trim();

  if(!text) return;

  if(!chatRoom){

    alert("No active trade chat");

    return;
  }

  firebase.database()
  .ref("chats/" + chatRoom)
  .push({

    text: text,

    sender: currentUser.uid,

    time: Date.now()

  });

  document.getElementById(
    "msg"
  ).value = "";

}

// ========================
// CREATE ESCROW
// ========================

async function createEscrowTrade(){

  if(!signer){

    alert("Connect wallet first");

    return;
  }

  const seller =
  document.getElementById(
    "sellerWallet"
  ).value;

  const amount =
  document.getElementById(
    "ethAmount"
  ).value;

  if(!seller || !amount){

    alert("Fill all fields");

    return;
  }

  try{

    const tx =
    await contract.createTrade(

      seller,

      {

        value:
        ethers.utils.parseEther(
          amount
        )

      }

    );

    await tx.wait();

    alert("Escrow created!");

  }catch(err){

    console.error(err);

    alert("Escrow failed");

  }

}

// ========================
// CONFIRM ESCROW
// ========================

async function confirmEscrow(){

  const tradeId =
  document.getElementById(
    "tradeId"
  ).value;

  if(!tradeId){

    alert("Enter trade ID");

    return;
  }

  try{

    const tx =
    await contract.confirmTrade(
      tradeId
    );

    await tx.wait();

    alert("Trade confirmed!");

  }catch(err){

    console.error(err);

    alert("Confirmation failed");

  }

}

// ========================
// LOGOUT
// ========================

function logout(){

  firebase.auth()
  .signOut()
  .then(()=>{

    window.location.href =
    "login.html";

  });

}

</script>

</body>
</html>
